<div *ngIf="visible" class="popup-overlay">
  <div class="popup-box" [ngClass]="type">

    <span class="close-btn" (click)="close()">×</span>

    <div class="icon">
      <i *ngIf="type === 'success'" class="fa fa-check-circle"></i>
      <i *ngIf="type === 'error'" class="fa fa-times-circle"></i>
    </div>

    <p>{{message}}</p>

  </div>
</div>
